<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<title>Chords · Ear Trainer</title>
<link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
  <!-- Только настройки этой тренировки. Остальное — ссылку «назад», экран с ответом, поля
       Tempo/Repeats/Replay и кнопки Start/Stop — достраивает движок (EarTrainer.create) -->
  <div class="controls">
    <details class="group">
      <summary>Chord types <span id="chordCount"></span></summary>
      <div id="chords" class="toggles cols-5" role="group" aria-label="Chord types"></div>
    </details>
    <label>Mode
      <select id="mode">
        <option value="block" selected>Block</option>
        <option value="arpeggio">Arpeggio</option>
        <option value="mixed">Mixed</option>
      </select>
    </label>
    <label>Inversion
      <select id="inversion">
        <option value="0" selected>Root position</option>
        <option value="1">1st inversion</option>
        <option value="2">2nd inversion</option>
        <option value="3">3rd inversion</option>
        <option value="random">Random</option>
      </select>
    </label>
  </div>

<script src="assets/voice/chords.js"></script>
<script src="assets/js/common.js"></script>
<script>
// Тренировка видов аккордов. Общий движок (звук, цикл, голос, настройки) — в assets/js/common.js.
const ET = EarTrainer;

const WHOLE_BEATS = ET.BAR_BEATS;      // аккорд целиком звучит целую ноту (такт)
const ARPEGGIO_BEATS = 1;  // арпеджио: ноты вступают через четверть и звучат до конца последнего такта
const MAX_INVERSION = 3;   // обращения выше третьего не используются (и не озвучены)
const CHORD_LOW = 48;      // C3: ниже аккорды в тесном расположении звучат неразборчиво
const NOTES_LEVEL = 2;     // суммарная громкость нот аккорда — как у двух нот интервала

// Индекс (с 1) — id вида в сохранённых настройках, поэтому новые виды добавляются в конец.
// steps — полутоны от основного тона в основном виде; off — вид выключен по умолчанию;
// say — фраза для голоса, если она отличается от name. Такие же фразы должны быть
// в make-voice.sh (ветка chords), иначе запись не найдётся.
// У 11, maj7♯11, 13 и m13 часть ступеней пропущена, как это принято на практике.
const CHORDS = [
  null,
  { name: 'Major',               short: 'maj',  steps: [0, 4, 7] },
  { name: 'Minor',               short: 'min',  steps: [0, 3, 7] },
  { name: 'Diminished',          short: 'dim',  steps: [0, 3, 6] },
  { name: 'Augmented',           short: 'aug',  steps: [0, 4, 8] },
  { name: 'Sus2',                short: 'sus2', steps: [0, 2, 7], say: 'Sus two' },
  { name: 'Sus4',                short: 'sus4', steps: [0, 5, 7], say: 'Sus four' },
  { name: 'Major seventh',       short: 'maj7', steps: [0, 4, 7, 11] },
  { name: 'Dominant seventh',    short: '7',    steps: [0, 4, 7, 10] },
  { name: 'Minor seventh',       short: 'm7',   steps: [0, 3, 7, 10] },
  { name: 'Half-diminished',     short: 'm7♭5', steps: [0, 3, 6, 10], say: 'Half diminished' },
  { name: 'Diminished seventh',  short: 'dim7', steps: [0, 3, 6, 9] },
  { name: 'Minor major seventh', short: 'mM7',  steps: [0, 3, 7, 11] },
  // Дополнительные виды
  { name: 'Power chord',         short: '5',       steps: [0, 7],                   off: true },
  { name: 'Major sixth',         short: '6',       steps: [0, 4, 7, 9],             off: true },
  { name: 'Minor sixth',         short: 'm6',      steps: [0, 3, 7, 9],             off: true },
  { name: 'Six-nine',            short: '6/9',     steps: [0, 4, 7, 9, 14], say: 'Six nine',         off: true },
  { name: 'Add9',                short: 'add9',    steps: [0, 4, 7, 14], say: 'Add nine',            off: true },
  { name: 'Minor add9',          short: 'madd9',   steps: [0, 3, 7, 14], say: 'Minor add nine',            off: true },
  { name: 'Add11',               short: 'add11',   steps: [0, 4, 7, 17], say: 'Add eleven',            off: true },
  { name: '7sus4',               short: '7sus4',   steps: [0, 5, 7, 10], say: 'Seven sus four',            off: true },
  { name: '7♭5',                 short: '7♭5',     steps: [0, 4, 6, 10], say: 'Seven flat five',            off: true },
  { name: '7♯5',                 short: '7♯5',     steps: [0, 4, 8, 10], say: 'Seven sharp five',            off: true },
  { name: 'Maj7♯5',              short: 'maj7♯5',  steps: [0, 4, 8, 11], say: 'Major seven sharp five',            off: true },
  { name: 'Dominant ninth',      short: '9',       steps: [0, 4, 7, 10, 14],        off: true },
  { name: 'Major ninth',         short: 'maj9',    steps: [0, 4, 7, 11, 14],        off: true },
  { name: 'Minor ninth',         short: 'm9',      steps: [0, 3, 7, 10, 14],        off: true },
  { name: '7♭9',                 short: '7♭9',     steps: [0, 4, 7, 10, 13], say: 'Seven flat nine',        off: true },
  { name: '7♯9',                 short: '7♯9',     steps: [0, 4, 7, 10, 15], say: 'Seven sharp nine',        off: true },
  { name: 'Dominant eleventh',   short: '11',      steps: [0, 7, 10, 14, 17],       off: true },
  { name: 'Minor eleventh',      short: 'm11',     steps: [0, 3, 7, 10, 14, 17],    off: true },
  { name: 'Maj7♯11',             short: 'maj7♯11', steps: [0, 4, 7, 11, 18], say: 'Major seven sharp eleven',        off: true },
  { name: 'Dominant thirteenth', short: '13',      steps: [0, 4, 7, 10, 14, 21],    off: true },
  { name: 'Minor thirteenth',    short: 'm13',     steps: [0, 3, 7, 10, 14, 21],    off: true },
];
// На сколько букв тон аккорда отстоит от основного (для записи нот), по числу полутонов:
// 3 и 4 — терция, 6 — ♭5, 8 — ♯5, 9 — секста, 13…15 — ♭9, 9 и ♯9, 17 и 18 — 11 и ♯11, 21 — 13.
// Секста записывается так и в dim7 (C E♭ G♭ A вместо строгого B♭♭) — так читается проще
const STEP_LETTERS = {
  0: 0, 2: 1, 3: 2, 4: 2, 5: 3, 6: 4, 7: 4, 8: 4, 9: 5, 10: 6, 11: 6,
  13: 1, 14: 1, 15: 1, 17: 3, 18: 3, 21: 5,
};
const INVERSIONS = ['root position', '1st inversion', '2nd inversion', '3rd inversion'];
const INVERSION_SAY = ['Root position', 'First inversion', 'Second inversion', 'Third inversion'];
const sayOf = (chord) => chord.say || chord.name;     // фраза для голоса

// Сколько обращений у аккорда: у трезвучий три (0…2), у аккордов из четырёх и более нот — четыре (0…3)
const maxInversionOf = (steps) => Math.min(MAX_INVERSION, steps.length - 1);

// Расположение аккорда в обращении: тоны снизу вверх, offset — полутоны от основного тона.
// В обращении N басом становится N-я нота аккорда, а ноты ниже неё переносятся вверх на октаву
// (у аккордов шире октавы, например add9, — на две, иначе они остались бы ниже баса)
function voicing(steps, inversion) {
  const bass = steps[inversion];
  return steps.map((step, i) => {
    let offset = step;
    if (i < inversion) while (offset < bass) offset += 12;
    return { offset, letters: STEP_LETTERS[step] };
  }).sort((a, b) => a.offset - b.offset);
}

// Некоторые аккорды в разных обращениях звучат одинаково, и на слух их не различить:
// sus2 во 2-м обращении — это sus4 в основном виде, 6 — обращение m7, m6 — обращение m7♭5,
// а у симметричных aug и dim7 совпадают все обращения. SAME_SOUND собирает такие совпадения:
// ключ — интервалы расположения от баса, значение — все пары { index, inversion } с таким звучанием
const shapeKey = (tones) => tones.map((tone) => tone.offset - tones[0].offset).join(',');
const SAME_SOUND = {};
CHORDS.forEach((chord, index) => {
  if (!chord) return;
  for (let inversion = 0; inversion <= maxInversionOf(chord.steps); inversion++) {
    (SAME_SOUND[shapeKey(voicing(chord.steps, inversion))] ||= []).push({ index, inversion });
  }
});

const modeEl = document.getElementById('mode');
const inversionEl = document.getElementById('inversion');

const trainer = ET.create({
  id: 'chords', pickQuestion, play, describe,
  phrases: [...CHORDS.slice(1).map(sayOf), ...INVERSION_SAY],
});
trainer.persist(modeEl, 'mode');
trainer.persist(inversionEl, 'inversion');

// Индексы видов аккордов, которые участвуют в тренировке
const enabled = trainer.toggleGroup(
  document.getElementById('chords'),
  CHORDS.slice(1).map((chord, i) => ({ id: i + 1, label: chord.short, title: chord.name, off: chord.off })),
  'chords',
  (set) => { document.getElementById('chordCount').textContent = `${set.size} of ${CHORDS.length - 1}`; },
);

// Есть ли у аккорда «двойник»: звучит ли он в каком-нибудь обращении так же, как другой включённый
// вид или как он сам в другом обращении. При случайном обращении такой вопрос имел бы два верных
// ответа, поэтому аккорды с двойником даются только в основном виде — тогда ответ один.
// Зависит от включённых видов: m7 теряет обращения, только пока включён 6
function hasTwin(index) {
  const steps = CHORDS[index].steps;
  for (let inversion = 0; inversion <= maxInversionOf(steps); inversion++) {
    const same = SAME_SOUND[shapeKey(voicing(steps, inversion))];
    if (same.some((s) => enabled.has(s.index) && !(s.index === index && s.inversion === inversion))) return true;
  }
  return false;
}

function pickQuestion() {
  const pool = [...enabled];       // только выбранные виды
  const index = ET.pick(pool);
  const steps = CHORDS[index].steps;

  // Если выбранного обращения у аккорда нет (3-е для трезвучия) — берём старшее из доступных.
  // При случайном обращении аккорд с двойником даётся только в основном виде
  const maxInversion = maxInversionOf(steps);
  const random = inversionEl.value === 'random';
  const inversion = random
    ? (hasTwin(index) ? 0 : ET.rand(maxInversion + 1))
    : Math.min(Number(inversionEl.value), maxInversion);

  const tones = voicing(steps, inversion);
  const lowestRoot = CHORD_LOW - tones[0].offset;
  const highestRoot = ET.HIGH - tones[tones.length - 1].offset;
  const root = lowestRoot + ET.rand(highestRoot - lowestRoot + 1);

  const arpeggio = ET.modeIs(modeEl.value, 'arpeggio');

  return {
    index, inversion, random, arpeggio, root,
    notes: tones.map((tone) => root + tone.offset),       // MIDI снизу вверх
    letters: tones.map((tone) => tone.letters),           // буквы тех же нот — для записи
  };
}

// Планирует аккорд с момента t, возвращает его длительность в секундах
function play(q, t, beat) {
  const n = q.notes.length;
  // Аккорд целиком занимает такт; арпеджио из пяти и более нот — два такта, чтобы все ноты уместились
  const bars = q.arpeggio ? Math.ceil(n * ARPEGGIO_BEATS / WHOLE_BEATS) : 1;
  const total = bars * WHOLE_BEATS * beat;
  const level = NOTES_LEVEL / n;
  q.notes.forEach((midi, i) => {
    // Арпеджио — снизу вверх; каждая нота держится до конца, так что в итоге звучит весь аккорд
    const delay = q.arpeggio ? i * ARPEGGIO_BEATS * beat : 0;
    ET.playNote(midi, t + delay, total - delay, level);
  });
  return total;
}

function describe(q) {
  const names = ET.spellNotes(q.root, q.notes.map((midi, i) => ({ midi, letters: q.letters[i] })));
  return {
    label: q.arpeggio ? 'arpeggio' : 'block',
    answer: CHORDS[q.index].name,
    notes: `${names.join(' ')} · ${INVERSIONS[q.inversion]}`,
    // Обращение произносится, только когда оно случайное — иначе оно и так известно
    voice: q.random ? [sayOf(CHORDS[q.index]), INVERSION_SAY[q.inversion]] : sayOf(CHORDS[q.index]),
  };
}
</script>
</body>
</html>
