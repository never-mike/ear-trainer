<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<title>Progressions · Ear Trainer</title>
<link rel="stylesheet" href="assets/css/common.css">
<style>
  /* Ответ — несколько строк по четыре такта, поэтому шрифт меньше и переносы строк сохраняются */
  #answer { font-size: 30px; white-space: pre-line; }
  #notes { white-space: pre-line; }
</style>
</head>
<body>
  <!-- Только настройки этой тренировки. Остальное — ссылку «назад», экран с ответом, поля
       Tempo/Repeats/Replay и кнопки Start/Stop — достраивает движок (EarTrainer.create) -->
  <div class="controls">
    <label>Key
      <select id="key">
        <option value="random" selected>Random</option>
      </select>
    </label>
    <label>Bars
      <input id="bars" type="number" inputmode="numeric" min="1" max="16" step="1" value="4">
    </label>
    <label>Source
      <select id="source">
        <option value="common" selected>Common progressions</option>
        <option value="random">Random</option>
        <option value="mixed">Mixed</option>
      </select>
    </label>
    <label>Keep the same progression
      <input id="same" type="checkbox">
    </label>
  </div>

<script src="assets/voice/progressions.js"></script>
<script src="assets/js/common.js"></script>
<script>
// Тренировка аккордовых прогрессий. Общий движок (звук, цикл, голос, настройки) — в assets/js/common.js.
// Аккорды — ступени мажорного лада (I ii iii IV V vi vii°), по одному на такт, размер 4/4.
const ET = EarTrainer;

const BAR_BEATS = 4;         // размер 4/4
const MIN_BARS = 1;
const MAX_BARS = 16;
const DEFAULT_BARS = 4;
const BASS_LOW = 40;         // E2: бас лежит в октаве E2…D♯3, верхние голоса — октавой выше
const UPPER_LEVEL = 0.5;     // громкость каждой ноты трезвучия
const BASS_LEVEL = 0.8;      // громкость баса
const RING_EIGHTHS = 2;      // каждая восьмая звучит две восьмых — слитно, как с педалью

// Ступени мажорного лада: индекс 0…6 = ступень I…VII
const MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];              // полутоны от тоники
const QUALITY = ['maj', 'min', 'min', 'maj', 'maj', 'min', 'dim'];
const NUMERALS = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];
// Фразы для голоса; такие же должны быть в make-voice.sh (ветка progressions)
const SAY = ['One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven'];
const TRIAD = { maj: [0, 4, 7], min: [0, 3, 7], dim: [0, 3, 6] };   // всегда в основном виде
const SUFFIX = { maj: '', min: 'm', dim: '°' };

const KEYS = ET.KEYS;      // тональности — общие для всех тренировок, см. common.js

// Общепринятые последовательности; числа — ступени 1…7
const COMMON = [
  // 2 такта
  [1, 4], [1, 5], [1, 6],
  // 3 такта
  [1, 4, 5], [2, 5, 1],
  // 4 такта
  [1, 5, 6, 4],     // «ось» — самая частая в поп-музыке
  [6, 4, 1, 5],     // она же с шестой ступени
  [1, 6, 4, 5],     // 50-е, ду-воп
  [1, 4, 5, 1],
  [1, 4, 5, 4],
  [1, 4, 1, 5],
  [1, 4, 6, 5],
  [1, 6, 2, 5],     // турнараунд
  [2, 5, 1, 6],
  [1, 3, 4, 5],
  [4, 1, 5, 6],
  [6, 5, 4, 5],
  [4, 5, 3, 6],     // «королевская дорога»
  // 8 тактов
  [1, 5, 6, 3, 4, 1, 4, 5],     // канон Пахельбеля
  [1, 5, 4, 4, 1, 5, 1, 5],     // восьмитактовый блюз
  // 12 тактов
  [1, 1, 1, 1, 4, 4, 1, 1, 5, 4, 1, 1],     // двенадцатитактовый блюз
  [1, 4, 1, 1, 4, 4, 1, 1, 5, 4, 1, 5],     // он же с быстрой сменой и турнараундом
].map((p) => p.map((degree) => degree - 1));

// Веса ступеней для случайной генерации: главные ступени чаще, vii° — реже
const RANDOM_WEIGHTS = [4, 2, 2, 4, 4, 3, 1];

const keyEl = document.getElementById('key');
const barsEl = document.getElementById('bars');
const sourceEl = document.getElementById('source');
const sameEl = document.getElementById('same');

const trainer = ET.create({ id: 'progressions', pickQuestion, play, describe, onStart, phrases: SAY });
ET.fillKeys(keyEl);        // до persist, иначе сохранённая тональность не восстановится
trainer.persist(keyEl, 'key');
trainer.persist(barsEl, 'bars');
trainer.persist(sourceEl, 'source');
trainer.persist(sameEl, 'same');

// ---------- Генерация последовательности ----------

function barCount() {
  const n = Math.round(Number(barsEl.value)) || DEFAULT_BARS;
  return Math.min(MAX_BARS, Math.max(MIN_BARS, n));
}

// Случайная последовательность: ступени по весам, без одинаковых аккордов в соседних тактах
function randomProgression(bars) {
  const result = [];
  while (result.length < bars) {
    const prev = result[result.length - 1];
    const weights = RANDOM_WEIGHTS.map((w, degree) => (degree === prev ? 0 : w));
    let pick = ET.rand(weights.reduce((a, b) => a + b, 0));
    let degree = 0;
    while (pick >= weights[degree]) pick -= weights[degree++];
    result.push(degree);
  }
  return result;
}

// Последовательность из коллекции. Если есть готовые нужной длины — берём одну из них
// (для длин больше четырёх тактов — через раз), иначе склеиваем из более коротких.
function commonProgression(bars) {
  const exact = COMMON.filter((p) => p.length === bars);
  if (exact.length && (bars <= 4 || ET.rand(2) === 0)) return exact[ET.rand(exact.length)];

  const result = [];
  while (result.length < bars) {
    const left = bars - result.length;
    const fitting = COMMON.filter((p) => p.length <= left && p.length < bars);
    if (!fitting.length) { result.push(0); continue; }     // остался один такт — тоника
    // Пока места хватает — любые куски от четырёх тактов; в хвост — самый длинный из подходящих
    const size = Math.min(4, Math.max(...fitting.map((p) => p.length)));
    const pool = fitting.filter((p) => (size === 4 ? p.length >= 4 : p.length === size));
    result.push(...pool[ET.rand(pool.length)]);
  }
  return result;
}

function generate(bars) {
  const source = sourceEl.value;
  const random = source === 'random' || (source === 'mixed' && ET.rand(2) === 0);
  return random ? randomProgression(bars) : commonProgression(bars);
}

// ---------- Вопрос ----------

let kept = null;          // последовательность, которая повторяется в режиме «Keep the same progression»
let keptFor = '';         // настройки, при которых она создана: при их смене создаётся новая
let lastKey = -1;         // чтобы случайная тональность не выпадала дважды подряд

// Каждый Start начинает с новой последовательности, даже в режиме повтора
function onStart() { kept = null; }

function pickQuestion() {
  const bars = barCount();
  let degrees;
  if (sameEl.checked) {
    const settings = `${bars}|${sourceEl.value}`;
    if (!kept || keptFor !== settings) { kept = generate(bars); keptFor = settings; }
    degrees = kept;
  } else {
    kept = null;
    degrees = generate(bars);
  }

  let key = Number(keyEl.value);
  if (keyEl.value === 'random' || !KEYS[key]) key = ET.randExcept(KEYS.length, lastKey);
  lastKey = key;

  // Аккорды всегда в основном виде: бас — основной тон в октаве E2…D♯3, трезвучие — октавой выше
  const chords = degrees.map((degree) => {
    const rootPc = (KEYS[key].pc + MAJOR_SCALE[degree]) % 12;
    const bass = ET.atOrAbove(rootPc, BASS_LOW);
    return { bass, upper: TRIAD[QUALITY[degree]].map((step) => bass + 12 + step) };
  });

  return { key, degrees, chords };
}

// Такт — восемь восьмых: трезвучие, бас, и так четыре раза (как во вступлении «Imagine»).
// Возвращает длительность последовательности в секундах. Сколько раз она звучит в вопросе,
// решает движок (поле Repeats, по умолчанию 4).
function play(q, t, beat) {
  const eighth = beat / 2;
  const bar = BAR_BEATS * beat;
  const ring = RING_EIGHTHS * eighth;
  q.chords.forEach((chord, i) => {
    for (let k = 0; k < BAR_BEATS; k++) {
      const at = t + i * bar + k * beat;
      for (const midi of chord.upper) ET.playNote(midi, at, ring, UPPER_LEVEL);
      ET.playNote(chord.bass, at + eighth, ring, BASS_LEVEL);
    }
  });
  return q.chords.length * bar;
}

// ---------- Ответ ----------

// Название аккорда на ступени: буква берётся по гамме, знак — по разнице с высотой этой буквы
function chordName(key, degree) {
  return ET.spell(KEYS[key].letter + degree, KEYS[key].pc + MAJOR_SCALE[degree]) + SUFFIX[QUALITY[degree]];
}

// Раскладывает такты по четыре в строке
function rows(items, separator) {
  const lines = [];
  for (let i = 0; i < items.length; i += 4) lines.push(items.slice(i, i + 4).join(separator));
  return lines.join('\n');
}

function describe(q) {
  const bars = q.degrees.length;
  return {
    label: `${bars} ${bars === 1 ? 'bar' : 'bars'}`,
    answer: rows(q.degrees.map((degree) => NUMERALS[degree]), ' – '),
    notes: `Key of ${KEYS[q.key].name}\n${rows(q.degrees.map((degree) => chordName(q.key, degree)), '  ')}`,
    voice: q.degrees.map((degree) => SAY[degree]),      // номера ступеней подряд
  };
}
</script>
</body>
</html>
